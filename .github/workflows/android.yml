name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Commit submodule dipakai kalau folder submodule kosong (mis. repo dibuat dari ZIP tanpa .git).
  PRELOADER_REPO: https://github.com/LiteLDev/preloader-android
  PRELOADER_REF: 5d108da350ce3e7f13f51415f81e65344ecd5d14
  LIBHTTPCLIENT_REPO: https://github.com/microsoft/libHttpClient
  LIBHTTPCLIENT_REF: af94ca33f0cbc299bc9d56f17a9f9e1e6fa321f3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Ensure native submodules are present
        run: |
          set -euo pipefail
          fetch() {
            local dir="$1" repo="$2" ref="$3"
            if [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "$dir already populated"
              return
            fi
            echo "$dir is empty; cloning $repo@$ref"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "$repo"
            git -C "$dir" fetch -q --depth 1 origin "$ref"
            git -C "$dir" checkout -q FETCH_HEAD
          }
          fetch app/src/main/cpp/preloader "$PRELOADER_REPO" "$PRELOADER_REF"
          fetch app/src/main/cpp/libHttpClient "$LIBHTTPCLIENT_REPO" "$LIBHTTPCLIENT_REF"
          test -f app/src/main/cpp/preloader/CMakeLists.txt
          test -f app/src/main/cpp/libHttpClient/Build/libHttpClient.Android/CMakeLists.txt

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Prepare google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          # Tanpa secret ini build tetap jalan; Firebase/Crashlytics otomatis nonaktif.
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without Firebase."
            exit 0
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json, sys
          expected = "com.sally.launcher"
          with open("app/google-services.json", encoding="utf-8") as fp:
              data = json.load(fp)
          names = {c.get("client_info", {}).get("android_client_info", {}).get("package_name")
                   for c in data.get("client", [])}
          if expected not in names:
              print(f"package_name mismatch: expected {expected}, got {sorted(n for n in names if n)}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 cmake;3.22.1"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Detect signing secrets
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEY_STORE }}
        run: |
          if [ -n "${KEYSTORE:-}" ]; then echo "HAS_SIGNING=true" >> "$GITHUB_ENV"; else echo "HAS_SIGNING=false" >> "$GITHUB_ENV"; fi

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Debug, Beta and Unsigned Release APKs
        run: ./gradlew assembleDebug assembleBeta assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SallyLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload R8 mappings
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SallyLauncher-r8-mappings-${{ github.sha }}
          path: |
            app/build/outputs/mapping/debug/
            app/build/outputs/mapping/beta/
            app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SallyLauncher-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SallyLauncher-beta-apk
          path: app/build/outputs/apk/beta/*.apk

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING == 'true'
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename APK with tag
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING == 'true'
        run: |
          TAG=${GITHUB_REF_NAME}
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_DST="SallyLauncher-${TAG}-release.apk"
          cp "$SIGNED_APK" "$APK_DST"
          echo "Signed APK renamed to $APK_DST"

      - name: Upload Signed APK Artifact
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SallyLauncher-${{ github.ref_name }}-release.apk
          path: SallyLauncher-${{ github.ref_name }}-release.apk

      - name: Generate GitHub release notes
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING == 'true'
        run: python3 scripts/render_release_notes.py resources/launcher/changelog.json release-notes.md

      - name: Release APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: SallyLauncher-${{ github.ref_name }}-release.apk
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SallyLauncher-${{ github.ref_name }}-release.apk"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then echo "No DISCORD_WEBHOOK; skipping."; exit 0; fi
          EMBED_TITLE="🚀 SallyLauncher Update!"
          EMBED_DESC="A new version of **LeviLaunchroid** is ready."
          EMBED_COLOR=5814783
          THUMB_URL='https://avatars.githubusercontent.com/u/78095377?s=200&v=4'

          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"$EMBED_TITLE\",
              \"description\": \"$EMBED_DESC\",
              \"color\": $EMBED_COLOR,
              \"thumbnail\": { \"url\": \"$THUMB_URL\" },
              \"fields\": [
                {
                  \"name\": \"📦 Version\",
                  \"value\": \"\`$TAG_NAME\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"🔗 Download\",
                  \"value\": \"[**Click here to download APK**]($APK_URL)\",
                  \"inline\": true
                }
              ]
            }]
          }" \
          "$DISCORD_WEBHOOK"
